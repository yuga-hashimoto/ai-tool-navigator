name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: project-ad4ba807-fc4c-4914-b2e
  SERVICE_NAME: ai-tool-navigator
  REGION: asia-northeast1
  GAR_LOCATION: us-central1
  GAR_REPO: app-repo

jobs:
  client-runtime-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run client runtime smoke gate
        run: npx playwright test tests/e2e/client-runtime-smoke.spec.ts --config=playwright.ci-runtime.config.ts --project=chromium

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: client-runtime-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/68731789052/locations/global/workloadIdentityPools/gh-actions-pool/providers/gh-actions-provider'
          service_account: 'github-actions-sa@project-ad4ba807-fc4c-4914-b2e.iam.gserviceaccount.com'

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_GRID=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_GRID }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_CONTENT=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_CONTENT }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_SIDEBAR=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_SIDEBAR }}
            NEXT_PUBLIC_GOOGLE_GAM_NETWORK_ID=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_NETWORK_ID }}
            NEXT_PUBLIC_GOOGLE_GAM_SLOT_GRID=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_SLOT_GRID }}
            NEXT_PUBLIC_GOOGLE_GAM_SLOT_CONTENT=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_SLOT_CONTENT }}
            NEXT_PUBLIC_GOOGLE_GAM_SLOT_SIDEBAR=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_SLOT_SIDEBAR }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_DOMAIN }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:latest
          flags: '--allow-unauthenticated'
          env_vars: |
            NODE_ENV=production
            GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
            GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
            CONTENT_SYNC_SECRET=${{ secrets.CONTENT_SYNC_SECRET }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            CONTENT_SYNC_OPENAI_API_KEY=${{ secrets.CONTENT_SYNC_OPENAI_API_KEY }}
            CONTENT_SYNC_OPENAI_ENDPOINT=${{ vars.CONTENT_SYNC_OPENAI_ENDPOINT }}
            CONTENT_SYNC_OPENAI_MODEL=${{ vars.CONTENT_SYNC_OPENAI_MODEL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_GRID=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_GRID }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_CONTENT=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_CONTENT }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_SIDEBAR=${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_SLOT_SIDEBAR }}
            NEXT_PUBLIC_GOOGLE_GAM_NETWORK_ID=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_NETWORK_ID }}
            NEXT_PUBLIC_GOOGLE_GAM_SLOT_GRID=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_SLOT_GRID }}
            NEXT_PUBLIC_GOOGLE_GAM_SLOT_CONTENT=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_SLOT_CONTENT }}
            NEXT_PUBLIC_GOOGLE_GAM_SLOT_SIDEBAR=${{ vars.NEXT_PUBLIC_GOOGLE_GAM_SLOT_SIDEBAR }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_DOMAIN }}
