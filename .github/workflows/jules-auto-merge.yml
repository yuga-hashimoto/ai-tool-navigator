name: Jules PR Auto Review & Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'

jobs:
  detect-and-process-jules-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Process Jules PRs
        id: process
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "🔍 Detecting Jules PRs..."

          # Get all open PRs
          PRS_JSON=$(gh pr list --repo "$REPO" --state open --json number,title,author,body,headRefName,baseRefName,mergeStateStatus,reviewDecision,statusCheckRollup --limit 100)

          # Find Jules PRs (author is yuga-hashimoto AND body contains Jules signature)
          JULES_PRS=$(echo "$PRS_JSON" | jq -r '.[] | select(.author.login == "yuga-hashimoto" and (.body // "" | contains("PR created automatically by Jules"))) | .number')

          if [ -z "$JULES_PRS" ]; then
            echo "✅ No Jules PRs found"
            echo "jules_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL_JULES=$(echo "$JULES_PRS" | wc -l | tr -d ' ')
          echo "📊 Found $TOTAL_JULES Jules PRs"
          echo "jules_count=$TOTAL_JULES" >> "$GITHUB_OUTPUT"

          MERGED_COUNT=0
          APPROVED_COUNT=0
          NEEDS_FIX=0

          for PR_NUM in $JULES_PRS; do
            echo ""
            echo "=== Processing PR #$PR_NUM ==="

            # Get detailed PR info
            PR_JSON=$(gh pr view "$PR_NUM" --repo "$REPO" --json number,title,author,body,headRefName,baseRefName,mergeStateStatus,reviewDecision,statusCheckRollup)

            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
            BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.baseRefName')
            MERGE_STATE=$(echo "$PR_JSON" | jq -r '.mergeStateStatus')
            REVIEW_DECISION=$(echo "$PR_JSON" | jq -r '.reviewDecision')

            # Check CI status (statusCheckRollup can be array or object)
            CI_STATUS=$(echo "$PR_JSON" | jq -r 'if (.statusCheckRollup | type) == "array" then (.statusCheckRollup | map(.conclusion // .status) | unique | .[0] // "PENDING") else (.statusCheckRollup.state // "PENDING") end')
            MERGE_STATE=$(echo "$PR_JSON" | jq -r '.mergeStateStatus // "UNKNOWN"')
            REVIEW_DECISION=$(echo "$PR_JSON" | jq -r '.reviewDecision // "NONE"')
            echo "  Title: $PR_TITLE"
            echo "  Branch: $PR_BRANCH -> $BASE_BRANCH"
            echo "  Merge State: $MERGE_STATE"
            echo "  Review Decision: $REVIEW_DECISION"
            echo "  CI Status: $CI_STATUS"

            # Skip if already merged
            if [ "$MERGE_STATE" = "MERGED" ]; then
              echo "  ⏭️ Already merged, skipping"
              continue
            fi

            # Handle merge conflicts
            if [ "$MERGE_STATE" = "DIRTY" ] || [ "$MERGE_STATE" = "CONFLICTING" ]; then
              echo "  ⚠️ Merge conflict detected"
              echo "  🔧 Attempting auto-rebase..."

              git config user.name "Jules Auto-Merge"
              git config user.email "jules@ai-tool-navigator.local"

              git fetch origin "$BASE_BRANCH"
              git checkout "$PR_BRANCH"

              if git rebase "origin/$BASE_BRANCH"; then
                echo "  ✅ Rebase successful, force pushing..."
                git push --force-with-lease origin "$PR_BRANCH"
                echo "  🔄 Rebased PR #$PR_NUM"
                NEEDS_FIX=$((NEEDS_FIX + 1))
              else
                echo "  ❌ Auto-rebase failed, skipping"
                git rebase --abort || true
                continue
              fi
            fi

            # Auto-approve if not approved (skip human review)
            if [ "$REVIEW_DECISION" != "APPROVED" ]; then
              echo "  🔍 Auto-approving PR (bypassing human review)..."
              gh pr review "$PR_NUM" --repo "$REPO" --approve --body "✅ Auto-approved by Jules Auto-Merge workflow. CI quality gates will ensure code quality."
              echo "  ✅ Approved"
              APPROVED_COUNT=$((APPROVED_COUNT + 1))
            fi

            # Check if ready to merge (CI passed + no conflicts + approved)
            if [ "$CI_STATUS" = "SUCCESS" ] && [ "$MERGE_STATE" = "CLEAN" ]; then
              echo "  🚀 All checks passed, auto-merging..."
              gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch --auto || {
                echo "  ⚠️ Auto-merge failed, attempting manual merge..."
                gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch || true
              }
              echo "  ✅ Merged PR #$PR_NUM"
              MERGED_COUNT=$((MERGED_COUNT + 1))
            elif [ "$CI_STATUS" = "FAILURE" ] || [ "$CI_STATUS" = "ERROR" ]; then
              echo "  ❌ CI failed for PR #$PR_NUM"

              # Get failed checks
              FAILED_CHECKS=$(gh pr checks "$PR_NUM" --repo "$REPO" --json name,conclusion 2>/dev/null | jq -r '.[] | select(.conclusion == "FAILURE" or .conclusion == "ERROR") | .name' | tr '\n' ',' | sed 's/,$//')

              # Comment with failure info
              gh pr comment "$PR_NUM" --repo "$REPO" --body "🤖 Jules Auto-Merge: CI checks failed. Failed checks: ${FAILED_CHECKS}. Auto-fix will be attempted." || true
              NEEDS_FIX=$((NEEDS_FIX + 1))
            elif [ "$CI_STATUS" = "PENDING" ] || [ "$CI_STATUS" = "null" ]; then
              echo "  ⏳ CI pending or no checks, will retry on next run"
            fi

          done

          echo ""
          echo "=== Summary ==="
          echo "Total Jules PRs: $TOTAL_JULES"
          echo "Approved: $APPROVED_COUNT"
          echo "Merged: $MERGED_COUNT"
          echo "Needs Fix: $NEEDS_FIX"

          echo "approved_count=$APPROVED_COUNT" >> "$GITHUB_OUTPUT"
          echo "merged_count=$MERGED_COUNT" >> "$GITHUB_OUTPUT"
          echo "needs_fix_count=$NEEDS_FIX" >> "$GITHUB_OUTPUT"

      - name: Report Results
        if: always()
        env:
          JULES_COUNT: ${{ steps.process.outputs.jules_count }}
          MERGED: ${{ steps.process.outputs.merged_count }}
          APPROVED: ${{ steps.process.outputs.approved_count }}
          NEEDS_FIX: ${{ steps.process.outputs.needs_fix_count }}
        run: |
          if [ "${JULES_COUNT:-0}" -eq 0 ]; then
            exit 0
          fi

          echo "📊 Jules Auto-Merge Results:"
          echo "- Total PRs: $JULES_COUNT"
          echo "- Approved: $APPROVED"
          echo "- Merged: $MERGED"
          echo "- Needs Fix: $NEEDS_FIX"
