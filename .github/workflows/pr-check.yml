name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  # Fast static checks: catch lint/type errors before building
  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed files (ESLint — catches React hook violations, type issues)
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only -z HEAD^1 HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JS/TS files changed."
            exit 0
          fi

          npx eslint "${files[@]}"

  type-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript type check
        run: npx tsc --noEmit

  # Full integration smoke test (build → start → Playwright)
  smoke:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run client runtime smoke test
        run: npx playwright test tests/e2e/client-runtime-smoke.spec.ts --config=playwright.ci-runtime.config.ts
        env:
          CI: 'true'
          # Tell webServer to skip rebuild — app is already built above
          SKIP_BUILD: 'true'
