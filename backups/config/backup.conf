#!/bin/bash
#
# Database Backup Configuration
# For PostgreSQL (Supabase compatible)
#

# Database Configuration
export DATABASE_URL="${DATABASE_URL}"
export DB_HOST="${DB_HOST:-localhost}"
export DB_PORT="${DB_PORT:-5432}"
export DB_NAME="${DB_NAME:-postgres}"
export DB_USER="${DB_USER:-postgres}"
export DB_PASSWORD="${DB_PASSWORD}"

# Backup Storage Configuration
export BACKUP_DIR="/Users/yu-ga/.clawdbot/agents/monetize-agent/backups"
export BACKUP_RETENTION_DAYS=30
export BACKUP_RETENTION_WEEKLY=8
export BACKUP_RETENTION_MONTHLY=12

# Remote Storage (S3) Configuration
export S3_ENABLED="${S3_ENABLED:-false}"
export S3_BUCKET="${S3_BUCKET:-my-app-backups}"
export S3_REGION="${S3_REGION:-us-east-1}"
export S3_ENDPOINT="${S3_ENDPOINT:-}"  # For S3-compatible storage like MinIO
export S3_ACCESS_KEY="${S3_ACCESS_KEY}"
export S3_SECRET_KEY="${S3_SECRET_KEY}"
export S3_PREFIX="${S3_PREFIX:-database}"

# Backup Types
export ENABLE_FULL_BACKUP="${ENABLE_FULL_BACKUP:-true}"
export ENABLE_INCREMENTAL="${ENABLE_INCREMENTAL:-false}"
export INCREMENTAL_WAL_ARCHIVE="${INCREMENTAL_WAL_ARCHIVE:-false}"

# Encryption Configuration
export ENCRYPT_BACKUPS="${ENCRYPT_BACKUPS:-true}"
export ENCRYPTION_KEY_FILE="${BACKUP_DIR}/config/backup.key"
export GPG_RECIPIENT="${GPG_RECIPIENT:-backup@example.com}"

# Scheduling
export BACKUP_HOUR="${BACKUP_HOUR:-2}"
export BACKUP_MINUTE="${BACKUP_MINUTE:-0}"
export FULL_BACKUP_DAY="${FULL_BACKUP_DAY:-0}"  # 0=Sunday

# Monitoring
export SLACK_WEBHOOK_URL="${SLACK_WEBHOOK_URL:-}"
export EMAIL_ALERT_RECIPIENT="${EMAIL_ALERT_RECIPIENT:-}"
export HEALTHCHECK_URL="${HEALTHCHECK_URL:-}"

# Verification
export VERIFY_BACKUPS="${VERIFY_BACKUPS:-true}"
export RESTORE_TEST_DAYS="${RESTORE_TEST_DAYS:-7}"  # Test restore every N days
